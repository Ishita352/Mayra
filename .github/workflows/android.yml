name: Build Mayra Android
# CI verification workflow
# Release gate: Windows tests + Android unit tests + debug APK + artifact upload must all pass.

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Test Windows agent command allowlist
        run: python -m unittest discover -s tests -v

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify Android project structure
        shell: bash
        run: |
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          grep -q 'namespace = "com.mayra.assistant"' app/build.gradle.kts
          grep -q 'applicationId = "com.mayra.assistant"' app/build.gradle.kts
          test "$(grep -o 'versionCode = [0-9]*' app/build.gradle.kts | awk '{print $3}')" -ge 2
          grep -q 'versionName = "0.2.0"' app/build.gradle.kts
          if grep -RniE 'installation[ -]?password|bootstrap[ -]?password|install[ -]?password' app/src/main; then
            echo 'Installation/bootstrap password code detected; build blocked.'
            exit 1
          fi
          grep -q 'rootProject.name = "Mayra"' settings.gradle.kts
          grep -q 'include(":app")' settings.gradle.kts
          grep -q 'owner_command_authorized' app/src/main/java/com/mayra/assistant/ModernMayraHomeActivity.kt
          grep -q 'owner_command_authorized' app/src/main/java/com/mayra/assistant/MainActivity.kt
          grep -q 'Welcome Boss' app/src/main/java/com/mayra/assistant/ModernMayraHomeActivity.kt
          grep -q 'recognitionLanguage' app/src/main/java/com/mayra/assistant/MayraBackgroundVoiceService.kt
          grep -q 'mayra_voice_language' app/src/main/java/com/mayra/assistant/MayraBackgroundVoiceService.kt
          grep -q 'owner_command_authorized' app/src/main/java/com/mayra/assistant/MayraBackgroundVoiceService.kt
          grep -q 'ownerCommandAuthorized' app/src/main/java/com/mayra/assistant/MayraLockedPhoneVoiceGate.kt
          grep -q 'Owner verification required' app/src/main/java/com/mayra/assistant/MayraBackgroundVoiceService.kt
          grep -q 'bengali mode' app/src/main/java/com/mayra/assistant/MayraBackgroundCommandRouter.kt
          grep -q 'quickPair' app/src/main/java/com/mayra/assistant/LocalDeviceLinkCoordinator.kt
          grep -q 'markPaired' app/src/main/java/com/mayra/assistant/MayraWindowsPairingSession.kt
          grep -q 'Mayra Owner Command Access' app/src/main/java/com/mayra/assistant/MainActivity.kt

      - name: Run Android unit tests
        run: gradle test --no-daemon

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Verify final APK output
        shell: bash
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/debug/app-debug.apk
          echo "Final Mayra APK exists and is non-empty."

      - name: Generate APK checksum
        shell: bash
        run: |
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee app-debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mayra-debug-apk
          path: |\n            app/build/outputs/apk/debug/app-debug.apk\n            app-debug.apk.sha256
