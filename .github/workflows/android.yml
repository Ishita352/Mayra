name: Build Mayra Android
# CI verification workflow
# Release gate: Android unit tests + debug APK + artifact upload must all pass.

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify Android project structure
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          grep -q 'namespace = "com.mayra.assistant"' app/build.gradle.kts
          grep -q 'applicationId = "com.mayra.assistant"' app/build.gradle.kts
          version_code="$(grep -o 'versionCode = [0-9]*' app/build.gradle.kts | awk '{print $3}' | head -n1)"
          test -n "$version_code"
          test "$version_code" -ge 2
          grep -q 'versionName = "0.2.0"' app/build.gradle.kts

          # Mayra's own installation/bootstrap password feature must stay absent.
          # Scan executable source patterns rather than natural-language documentation,
          # so the CI gate does not reject the intentional "password disabled" text.
          forbidden_patterns=(
            'installationPassword'
            'bootstrapPassword'
            'installPassword'
            'verifyInstallationPassword'
            'verifyBootstrapPassword'
            'verifyInstallPassword'
            'installation_password'
            'bootstrap_password'
            'install_password'
          )
          for pattern in "${forbidden_patterns[@]}"; do
            if grep -RniE "$pattern" app/src/main --include='*.kt' --include='*.java'; then
              echo "Installation/bootstrap password implementation detected: $pattern"
              exit 1
            fi
          done
          echo "Core Android identity/password checks: PASS"

          checks=(
            "rootProject.name = \"Mayra\"|settings.gradle.kts"
            "include(\":app\")|settings.gradle.kts"
            "owner_command_authorized|app/src/main/java/com/mayra/assistant/ModernMayraHomeActivity.kt"
            "owner_command_authorized|app/src/main/java/com/mayra/assistant/MainActivity.kt"
            "রাধে রাধে বস|app/src/main/java/com/mayra/assistant/ModernMayraHomeActivity.kt"
            "recognitionLanguage|app/src/main/java/com/mayra/assistant/MayraBackgroundVoiceService.kt"
            "mayra_voice_language|app/src/main/java/com/mayra/assistant/MayraBackgroundVoiceService.kt"
            "owner_command_authorized|app/src/main/java/com/mayra/assistant/MayraBackgroundVoiceService.kt"
            "ownerCommandAuthorized|app/src/main/java/com/mayra/assistant/MayraLockedPhoneVoiceGate.kt"
            "bengali mode|app/src/main/java/com/mayra/assistant/MayraBackgroundCommandRouter.kt"
            "Mayra Owner Command Access|app/src/main/java/com/mayra/assistant/MainActivity.kt"
          )
          missing=0
          for item in "${checks[@]}"; do
            pattern="${item%%|*}"
            file="${item#*|}"
            if grep -qF "$pattern" "$file"; then
              echo "PASS: $pattern -> $file"
            else
              echo "WARNING: missing expected marker: $pattern -> $file"
              missing=$((missing+1))
            fi
          done
          echo "Static feature-check warnings: $missing"
          echo "Proceeding to real unit-test and APK build gates."

      - name: Run Android unit tests
        run: gradle test --no-daemon

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Verify final APK output
        shell: bash
        run: |
          set -euo pipefail
          test -f app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk >/dev/null
          echo "Final Mayra APK exists and is a valid ZIP archive."

      - name: Verify APK metadata
        shell: bash
        run: |
          set -euo pipefail
          test -f app/build/outputs/apk/debug/app-debug.apk
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q 'AndroidManifest.xml'
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q 'classes.dex'
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Generate APK checksum
        shell: bash
        run: |
          set -euo pipefail
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee app-debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mayra-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app-debug.apk.sha256
